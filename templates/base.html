<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}GitHub Repo Analyzer{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Architects+Daughter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="logo">🔍 Repo Analyzer</a>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-box">
        {% for m in messages %}<p>⚠️ {{ m }}</p>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Built with pure Python + Flask · GitHub REST API</footer>
</body>
</html>
